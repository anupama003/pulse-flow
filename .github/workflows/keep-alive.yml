# Keeps the Render free web service awake: Render sleeps a free service after about 15 minutes
# without traffic, and the first visit after that takes a minute to wake it.
#
# Set the site address once: GitHub repo → Settings → Secrets and variables → Actions →
# Variables → New repository variable: RENDER_URL = https://<your-service>.onrender.com
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health endpoint
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_URL isn't set (Settings → Secrets and variables → Actions → Variables). Skipping."
            exit 0
          fi
          # A sleeping service can take ~60 s to wake, so allow for it and retry once.
          curl --fail --silent --show-error --max-time 90 --retry 1 --retry-delay 10 "${RENDER_URL%/}/api/health"
